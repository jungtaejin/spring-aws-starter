spring:
  application:
    name: spring-aws-starter
  datasource:
    # Local/dev default: in-memory H2 in PostgreSQL compatibility mode so the same
    # Flyway migrations run everywhere.  In AWS the three DB_* variables are injected
    # by the EC2 user-data script from SSM Parameter Store (see infra/user_data.sh.tpl).
    url: ${DB_URL:jdbc:h2:mem:starter;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DB_USER:sa}
    password: ${DB_PASS:}
  jpa:
    hibernate:
      ddl-auto: none        # schema is owned by Flyway, never by Hibernate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  shutdown: graceful       # let the ALB drain in-flight requests during instance refresh

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true      # /actuator/health/liveness and /readiness for the target group
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    version: ${APP_VERSION:local}
