name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Build & test (Gradle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew --no-daemon test bootJar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: build/reports/tests/test

  image:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    needs: app
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: spring-aws-starter:ci
      - name: Smoke test the image
        run: |
          docker run -d --name app -p 8080:8080 spring-aws-starter:ci
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/actuator/health/readiness; then echo; echo OK; exit 0; fi
            sleep 2
          done
          docker logs app; exit 1

  infra:
    name: Terraform fmt & validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
